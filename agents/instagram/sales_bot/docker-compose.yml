version: '3.8'

services:
  ig_bot:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - META_PAGE_ACCESS_TOKEN=${META_PAGE_ACCESS_TOKEN}
      # Streamable HTTP URL of the Symfony MCP Server microservice
      - MCP_SERVER_URL=http://host.docker.internal:8788/
    restart: unless-stopped
